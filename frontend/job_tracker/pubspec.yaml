name: job_tracker
description: Personal Job Application Tracker mobile app.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State & navigation
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1

  # Networking
  dio: ^5.8.0+1

  # Firebase
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.2
  firebase_messaging: ^15.2.5
  google_sign_in: ^6.3.0

  # Secure local storage (non-token secrets / prefs if needed)
  flutter_secure_storage: ^9.2.4

  # Local / offline storage
  drift: ^2.26.0
  sqlite3_flutter_libs: ^0.5.32
  path_provider: ^2.1.5
  path: ^1.9.1

  # Models / serialization
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0

  # Utilities
  intl: ^0.20.2
  equatable: ^2.0.7
  flutter_dotenv: ^5.2.1
  url_launcher: ^6.3.2
  flutter_local_notifications: ^22.3.1
  app_links: ^7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.4.15
  freezed: ^3.0.0
  json_serializable: ^6.9.4
  drift_dev: ^2.26.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true

  assets:
    # `.env` is intentionally absent: it is gitignored, so a fresh checkout
    # never has it and declaring it fails `flutter analyze`. The local file is
    # read from disk instead (see lib/core/constants/env_file_loader.dart).
    - .env.example
    - assets/images/
    - assets/icons/
    # - assets/fonts/  # add when font files are present
